<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Mời Tất Niên 2025</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            margin: 50px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 {
            color: #dc3545;
        }
        p {
            font-size: 16px;
            color: #6c757d;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 20px 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            background-color: #28a745;
        }
        .btn:hover {
            background-color: #218838;
        }
        .btn-secondary {
            background-color: #dc3545;
        }
        .btn-secondary:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thiệp Mời Tham Gia Tất Niên 2024 </h1>
        <p>Kính mời toàn thể CBCNV tham dự.</p>
        <p><strong>Thời gian:</strong> 15:00, ngày 17/01/2025</p>
        <p><strong>Địa điểm:</strong> Tầng 2, Nhà hàng Ecogarden, Phố Nối, Yên Mỹ, Hưng Yên</p>
        <p>Vui lòng xác nhận tham gia:</p>
        <a href="#" class="btn">Tôi sẽ tham gia</a>
        <a href="#" class="btn btn-secondary">Tôi không tham gia</a>
    </div>
</body>
</html>
